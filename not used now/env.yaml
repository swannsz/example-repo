name: tcrkit
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=2.2.4           
  - pandas=2.2.3           
  - tqdm=4.67.1           
  - matplotlib=3.10.1
  - seaborn=0.13.2
  - click=8.1.8
  - dash=2.18.2
  - joblib=1.4.2
  - matplotlib-venn=1.1.2
  - networkx=3.4.2
  - plotly=6.0.0
  - python-levenshtein=0.27.1
  - rapidfuzz=3.13.0
  - scikit-learn=1.6.1
  - scipy=1.15.2
  - transformers=4.47.1
  - upsetplot=0.9.0
  - kneed=0.8.5
  - biopython=1.85
  - circlify=0.15.0
  - nbformat=5.10.4
  - ipywidgets=8.1.7
  - polars
 
  - pip                   # ensure pip is available for installing pip-only packages
  - pip:
      - dash-bootstrap-components==2.0.1
      - esm==3.2.0
      - torch==2.5.1
      - logomaker==0.8.7
        #- community==1.1.0
      - -e . # local package
